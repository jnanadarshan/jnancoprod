<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESPHome LVGL Designer has moved</title>
<meta http-equiv="refresh" content="5;url=../esphome-lvgl/">
<link rel="stylesheet" href="../shared/jdnx-theme.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--g-bg);color:var(--g-text);font-family:var(--g-font);padding:16px}
.card{max-width:440px;padding:32px;text-align:center}
h1{font-size:20px;margin:0 0 10px}p{color:var(--g-text-2);line-height:1.55;margin:0 0 18px;font-size:14px}
a.jd-btn{text-decoration:none;height:38px}
</style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7P5YFV6K4E"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7P5YFV6K4E');
    </script>
</head>
<body>
<div class="card jd-panel">
<h1>ESPHome LVGL Designer has been renamed</h1>
<p>This app was renamed to <b>ESPHome LVGL Designer</b> and now lives at a new address. You will be redirected in <b id="s">5</b> seconds.</p>
<a class="jd-btn" id="go" href="../esphome-lvgl/">Go to ESPHome LVGL Designer now</a>
</div>
<script>
(function(){
try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark-mode');}catch(e){}
var n=5,t=new URL('../esphome-lvgl/'+location.search+location.hash,location.href).href,el=document.getElementById('s');
document.getElementById('go').href=t;
setInterval(function(){if(--n>=0)el.textContent=n;if(n===0)location.replace(t);},1000);
// drop the old service worker/cache so it can't keep serving the old app
if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister();});});
if(window.caches)caches.keys().then(function(k){k.forEach(function(x){caches.delete(x);});});
})();
</script>
</body>
</html>
